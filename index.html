<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dormenique — Portfolio & Archive</title>
  
  <!-- Tipografia editorial retrô / contemporânea -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       PALETA DE CORES (Guia de Estilos)
       ========================================================= */
    :root {
      --red-1: #4A1521;
      --red-2: #9E1B2C;
      --red-3: #C85A6A;
      --red-4: #D99B9F;

      --pink-1: #D92B6B;
      --pink-2: #E75F94;
      --pink-3: #F29BBF;
      --pink-4: #FBE3ED;

      --purple-1: #501344;
      --purple-2: #A12577;
      --purple-3: #D895C7;

      --yellow-1: #60491B;
      --yellow-2: #D3922A;
      --yellow-3: #DEB265;
      --yellow-4: #DCC298;

      --black: #0E0E0E;
      --gray-1: #4F4B4B;
      --gray-2: #969595;
      --white: #FFFFFF;

      --bg-page: var(--pink-4);
      --card-bg: var(--white);
      --text-main: var(--black);
      --text-muted: var(--gray-1);
      --border-dark: var(--black);

      --font-display: 'Syne', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       HEADER & NAVEGAÇÃO TRIPARTIDA
       ========================================================= */
    header {
      background: var(--white);
      border-bottom: 2px solid var(--border-dark);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .nav-left {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-link {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: var(--red-2);
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--purple-1);
      text-transform: lowercase;
      text-align: center;
    }

    .brand-logo span {
      color: var(--red-2);
    }

    .nav-right {
      display: flex;
      gap: 1.25rem;
      justify-content: flex-end;
      align-items: center;
    }

    .lang-switcher {
      display: inline-flex;
      background: var(--pink-4);
      border: 2px solid var(--border-dark);
      border-radius: 999px;
      overflow: hidden;
    }

    .lang-btn {
      background: transparent;
      border: none;
      padding: 0.3rem 0.75rem;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--black);
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: var(--red-2);
      color: var(--white);
    }

    /* TICKER MARQUEE */
    .ticker-bar {
      background: var(--red-1);
      color: var(--yellow-4);
      border-bottom: 2px solid var(--border-dark);
      overflow: hidden;
      white-space: nowrap;
      padding: 0.65rem 0;
      font-family: var(--font-display);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .ticker-content {
      display: inline-block;
      animation: ticker 32s linear infinite;
    }

    @keyframes ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* =========================================================
       HERO EDITORIAL / GET TO KNOW ME
       ========================================================= */
    .hero-section {
      background-color: var(--white);
      border-bottom: 2px solid var(--border-dark);
      padding: 5rem 2rem;
    }

    .hero-container {
      max-width: 1080px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 4rem;
      align-items: center;
    }

    .hero-portrait-wrap {
      position: relative;
      width: 100%;
    }

    .hero-image-card {
      width: 100%;
      height: 480px;
      background: var(--pink-3);
      border: 2.5px solid var(--border-dark);
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 6px 6px 0px var(--border-dark);
    }

    .hero-image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .retro-badge {
      position: absolute;
      top: -20px;
      right: -20px;
      width: 76px;
      height: 76px;
      background: var(--pink-4);
      border: 2.5px solid var(--border-dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 4px 4px 0px var(--border-dark);
      transform: rotate(6deg);
      transition: transform 0.25s ease;
      z-index: 5;
    }

    .retro-badge:hover {
      transform: rotate(18deg) scale(1.08);
    }

    .badge-icon {
      width: 44px;
      height: 44px;
      fill: var(--red-2);
      display: block;
    }

    .hero-bio-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: var(--black);
      margin-bottom: 1.5rem;
    }

    .hero-lead-highlight {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--purple-1);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .hero-body-text {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      margin-bottom: 2rem;
      font-size: 0.98rem;
      color: var(--gray-1);
    }

    .hero-cta {
      display: inline-block;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 800;
      color: var(--black);
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 2.5px;
      transition: color 0.2s;
    }

    .hero-cta:hover {
      color: var(--red-2);
    }

    /* =========================================================
       CARDS INTRODUTÓRIOS
       ========================================================= */
    .cards-section {
      background-color: var(--yellow-4);
      border-bottom: 2px solid var(--border-dark);
      padding: 4.5rem 2rem;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.75rem;
      max-width: 1080px;
      margin: 0 auto;
    }

    .retro-card {
      background: var(--white);
      border: 2px solid var(--border-dark);
      border-radius: 1.25rem;
      padding: 2rem;
      box-shadow: 5px 5px 0px var(--border-dark);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .retro-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px var(--border-dark);
    }

    .card-label {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      color: var(--pink-1);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 800;
      margin-bottom: 0.85rem;
      color: var(--purple-1);
    }

    .card-desc {
      color: var(--gray-1);
      font-size: 0.92rem;
    }

    /* =========================================================
       TIMELINE COM ABAS
       ========================================================= */
    .section-wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 5rem 1.5rem;
    }

    .timeline-top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--red-1);
      text-transform: uppercase;
      border-left: 6px solid var(--yellow-2);
      padding-left: 1rem;
      margin-bottom: 0;
    }

    .timeline-tabs {
      display: inline-flex;
      background: var(--white);
      border: 2px solid var(--border-dark);
      border-radius: 999px;
      padding: 4px;
      box-shadow: 3px 3px 0px var(--border-dark);
    }

    .timeline-tab-btn {
      background: transparent;
      border: none;
      padding: 0.5rem 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 999px;
      color: var(--black);
      transition: all 0.2s ease;
    }

    .timeline-tab-btn.active {
      background: var(--purple-1);
      color: var(--white);
    }

    .timeline {
      position: relative;
      border-left: 3px solid var(--border-dark);
      margin-left: 1.5rem;
      padding-left: 2rem;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 3.5rem;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .timeline-item::before {
      content: '✦';
      position: absolute;
      left: calc(-2rem - 13px);
      top: -2px;
      width: 24px;
      height: 24px;
      background: var(--yellow-2);
      color: var(--black);
      border: 2px solid var(--border-dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .timeline-header-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
    }

    .timeline-year {
      font-family: var(--font-mono);
      background: var(--purple-1);
      color: var(--white);
      display: inline-block;
      padding: 0.22rem 0.65rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .timeline-type {
      font-family: var(--font-mono);
      background: var(--pink-2);
      color: var(--white);
      border: 1.5px solid var(--border-dark);
      display: inline-flex;
      align-items: center;
      padding: 0.18rem 0.65rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .timeline-city {
      font-family: var(--font-mono);
      background: var(--white);
      color: var(--red-2);
      border: 1.5px solid var(--border-dark);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.18rem 0.65rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.78rem;
    }

    .timeline-institution {
      font-family: var(--font-mono);
      background: var(--yellow-4);
      color: var(--yellow-1);
      border: 1.5px solid var(--border-dark);
      display: inline-flex;
      align-items: center;
      padding: 0.18rem 0.65rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.78rem;
    }

    .timeline-heading {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--black);
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .timeline-text {
      color: var(--gray-1);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 1rem;
    }

    .timeline-btn-more {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--black);
      background: var(--white);
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      padding: 0.45rem 0.9rem;
      box-shadow: 3px 3px 0px var(--border-dark);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .timeline-btn-more:hover {
      background: var(--yellow-2);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--border-dark);
    }

    /* =========================================================
       GALERIA DE OBRAS
       ========================================================= */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .gallery-item {
      background: var(--white);
      border: 2px solid var(--border-dark);
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 4px 4px 0px var(--border-dark);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .gallery-item:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--border-dark);
    }

    .gallery-img-container {
      width: 100%;
      height: 240px;
      background: var(--pink-3);
      border-bottom: 2px solid var(--border-dark);
      overflow: hidden;
    }

    .gallery-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover .gallery-img-container img {
      transform: scale(1.05);
    }

    .gallery-info {
      padding: 1.25rem;
    }

    .gallery-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--pink-1);
      font-weight: 700;
      text-transform: uppercase;
    }

    .gallery-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--black);
      margin: 0.25rem 0;
    }

    .gallery-desc {
      font-size: 0.88rem;
      color: var(--gray-1);
    }

    /* =========================================================
       CONTACT SECTION / FORMSPREE
       ========================================================= */
    .contact-section {
      background-color: var(--white);
      border-top: 2px solid var(--border-dark);
      padding: 5.5rem 1.5rem;
    }

    .contact-container {
      max-width: 720px;
      margin: 0 auto;
    }

    .contact-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .contact-header .section-title {
      display: inline-block;
      border-left: none;
      padding-left: 0;
      margin-bottom: 0.75rem;
    }

    .contact-subtitle {
      font-family: var(--font-mono);
      color: var(--gray-1);
      font-size: 0.95rem;
      max-width: 580px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .contact-card {
      background: var(--pink-4);
      border: 2.5px solid var(--border-dark);
      border-radius: 1.25rem;
      padding: 2.5rem;
      box-shadow: 6px 6px 0px var(--border-dark);
    }

    .form-group {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-label {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--purple-1);
      letter-spacing: 0.03em;
    }

    .form-input, .form-textarea {
      width: 100%;
      background: var(--white);
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--black);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--red-2);
      box-shadow: 3px 3px 0px var(--border-dark);
    }

    .form-textarea {
      min-height: 140px;
      resize: vertical;
    }

    .form-submit-btn {
      width: 100%;
      background: var(--red-2);
      color: var(--white);
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 800;
      padding: 0.95rem 1.5rem;
      border: 2px solid var(--border-dark);
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--border-dark);
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
    }

    .form-submit-btn:hover {
      background: var(--purple-1);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--border-dark);
    }

    .form-feedback {
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      border: 2px solid var(--border-dark);
      display: none;
    }

    .form-feedback.success {
      background: var(--yellow-4);
      color: var(--black);
      box-shadow: 3px 3px 0px var(--border-dark);
    }

    .form-feedback.error {
      background: #F8D7DA;
      color: #721C24;
      box-shadow: 3px 3px 0px var(--border-dark);
    }
    .contact-direct-wrap {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1.5px dashed var(--border-dark);
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--gray-1);
    }

    .contact-email-link {
      display: inline-block;
      margin-top: 0.35rem;
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--red-2);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .contact-email-link:hover {
      color: var(--purple-1);
    }

    /* =========================================================
       FOOTER
       ========================================================= */
    footer {
      background: var(--red-1);
      color: var(--white);
      border-top: 2px solid var(--border-dark);
      padding: 3.5rem 1.5rem;
      text-align: center;
    }

    .footer-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      color: var(--yellow-3);
    }

    .footer-copy {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--pink-4);
    }

    @media (max-width: 860px) {
      header {
        grid-template-columns: 1fr auto;
        gap: 1rem;
      }
      .nav-left {
        display: none;
      }
      .hero-container {
        grid-template-columns: 1fr;
        gap: 3rem;
      }
      .hero-portrait-wrap {
        max-width: 360px;
        margin: 0 auto;
      }
      .hero-image-card {
        height: 400px;
      }
      .hero-bio-wrap {
        text-align: center;
        align-items: center;
      }
      .timeline-top-bar {
        flex-direction: column;
        align-items: flex-start;
      }
      .contact-card {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGAÇÃO -->
  <header>
    <nav class="nav-left">
      <a href="#about" class="nav-link" id="nav-about"></a>
      <a href="#timeline" class="nav-link" id="nav-timeline"></a>
      <a href="#works" class="nav-link" id="nav-works"></a>
    </nav>
    
    <a href="#" class="brand-logo">dormenique<span>✦</span></a>

    <div class="nav-right">
      <a href="#contact" class="nav-link" id="nav-contact"></a>
      <div class="lang-switcher">
        <button class="lang-btn active" id="btn-pt" onclick="setLanguage('pt')">PT</button>
        <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
      </div>
    </div>
  </header>

  <!-- MARQUEE TICKER -->
  <div class="ticker-bar">
    <div class="ticker-content" id="ticker-text"></div>
  </div>

  <!-- HERO SECTION -->
  <section class="hero-section" id="about">
    <div class="hero-container">
      
      <!-- Lado Esquerdo: Foto & Selo com Símbolo ✦ -->
      <div class="hero-portrait-wrap">
        <div class="hero-image-card">
          <img id="hero-img" src="" alt="Dormenique" />
        </div>
        <div class="retro-badge" title="Dormenique ✦">
          <!-- Símbolo Estrela 4 Pontas / Sparkle Vectorial -->
          <svg class="badge-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M 50,0 Q 50,50 100,50 Q 50,50 50,100 Q 50,50 0,50 Q 50,50 50,0 Z" />
          </svg>
        </div>
      </div>

      <!-- Lado Direito: Apresentação -->
      <div class="hero-bio-wrap">
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-lead-highlight" id="hero-subtitle"></p>
        <div class="hero-body-text" id="hero-paragraphs"></div>
        <a href="#contact" class="hero-cta" id="hero-cta"></a>
      </div>

    </div>
  </section>

  <!-- CARDS INTRODUTÓRIOS -->
  <section class="cards-section">
    <div class="intro-grid" id="intro-cards"></div>
  </section>

  <!-- TIMELINE ARTÍSTICA COM ABAS DE FORMAÇÃO -->
  <section class="section-wrap" id="timeline">
    <div class="timeline-top-bar">

    let currentLang = 'pt';

    async function init() {
      try {
        const response = await fetch('./data.json');

        console.warn('Carregando dados de fallback...', err);
        data = FALLBACK_DATA;
      }
      render();
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btn-pt').classList.toggle('active', lang === 'pt');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      render();
    }

    function setTimelineTab(tab) {
      currentTimelineTab = tab;
      document.getElementById('tab-artistic').classList.toggle('active', tab === 'artistic');
      document.getElementById('tab-education').classList.toggle('active', tab === 'education');
      renderTimeline();
    }

    function renderTimeline() {

      const timelineContainer = document.getElementById('timeline-container');
      const learnMoreLabel = langData.learn_more || (currentLang === 'pt' ? 'Saiba mais ↗' : 'Learn more ↗');

          <div class="timeline-header-meta">
            <span class="timeline-year">${t.year}</span>
            ${t.type ? `<span class="timeline-type">${t.type}</span>` : ''}
            ${t.city ? `<span class="timeline-city">📍 ${t.city}</span>` : ''}
            ${t.institution ? `<span class="timeline-institution">🏛 ${t.institution}</span>` : ''}

          <h4 class="timeline-heading">${t.title}</h4>
          <p class="timeline-text">${t.text}</p>
          <a href="${t.link || '#'}" class="timeline-btn-more">
            ${learnMoreLabel}
          </a>
        </div>
      `).join('');
    }

    function render() {
      if (!data) return;
      const langData = data[currentLang];

      // Menu
      document.getElementById('nav-about').innerText = langData.nav.about;
      document.getElementById('nav-timeline').innerText = langData.nav.timeline;
      document.getElementById('nav-works').innerText = langData.nav.works;
      document.getElementById('nav-contact').innerText = langData.nav.contact;

      // Foto de perfil
      document.getElementById('hero-img').src = data.profile_image;

      // Hero
      document.getElementById('hero-title').innerText = langData.hero.title;
      document.getElementById('hero-subtitle').innerText = langData.hero.subtitle;
      
      const paragraphsContainer = document.getElementById('hero-paragraphs');
      paragraphsContainer.innerHTML = langData.hero.paragraphs.map(p => `<p>${p}</p>`).join('');

      ctaEl.innerText = langData.hero.cta_text;
      ctaEl.href = langData.hero.cta_link;

      // Ticker

      tickerEl.innerText = (langData.ticker + ' ').repeat(4);

      // Intro Cards

      introContainer.innerHTML = langData.intro_cards.map(c => `

          <div class="card-label">${c.label}</div>
          <h3 class="card-title">${c.title}</h3>
          <p class="card-desc">${c.desc}</p>
        </article>
      `).join('');

      // Timeline Cabeçalho e Abas
      document.getElementById('timeline-title').innerText = langData.timeline_title;
      document.getElementById('tab-artistic').innerText = langData.timeline_tabs?.artistic || 'Prática Artística';
      document.getElementById('tab-education').innerText = langData.timeline_tabs?.education || 'Formação & Estudos';
      renderTimeline();

      // Galeria
      document.getElementById('gallery-title').innerText = langData.gallery_title;
      const galleryContainer = document.getElementById('gallery-container');
      galleryContainer.innerHTML = data.gallery.map(g => `

      if (contactInfo) {

        document.getElementById('form-email-label').innerText = contactInfo.email_label;

        document.getElementById('form-submit-btn').innerText = contactInfo.submit_btn;
        document.getElementById('contact-direct-label').innerText = contactInfo.direct_email_label;
        
        const directEmail = data.contact_email || 'hello@dormenique.com';
        const emailLink = document.getElementById('contact-direct-email');
        emailLink.innerText = directEmail;
        emailLink.href = 'mailto:' + directEmail;
        
        // Formspree URL dinâmica
        const formspreeId = data.formspree_id || '';
        if (formspreeId && formspreeId !== 'SEU_ID_FORMSPREE') {
          document.getElementById('contact-form').action = 'https://formspree.io/f/' + formspreeId;

    document.addEventListener('DOMContentLoaded', () => {
      init();
      setupFormspreeAjax();
    });
    function setupFormspreeAjax() {
      const form = document.getElementById('contact-form');
      const feedback = document.getElementById('form-feedback');
      const submitBtn = document.getElementById('form-submit-btn');

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const originalBtnText = submitBtn.innerText;
        submitBtn.disabled = true;
        submitBtn.innerText = currentLang === 'pt' ? 'A enviar...' : 'Sending...';
        feedback.style.display = 'none';

        const formData = new FormData(form);

        try {
          const res = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
          });

          if (res.ok) {
            form.reset();
            feedback.className = 'form-feedback success';
            feedback.innerText = currentLang === 'pt' 
              ? '✓ Mensagem enviada com sucesso! Entrarei em contacto em breve.' 
              : '✓ Message sent successfully! I will be in touch soon.';
            feedback.style.display = 'block';
          } else {
            const data = await res.json();
            feedback.className = 'form-feedback error';
            feedback.innerText = data.errors ? data.errors.map(err => err.message).join(', ') : (currentLang === 'pt' ? 'Erro ao enviar a mensagem.' : 'Error sending message.');
            feedback.style.display = 'block';
          }
        } catch (err) {
          feedback.className = 'form-feedback error';
          feedback.innerText = currentLang === 'pt' ? 'Erro de ligação. Tente novamente.' : 'Connection error. Please try again.';
          feedback.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = originalBtnText;
        }
      });
    }
