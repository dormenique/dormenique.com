<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dormenique — Portfolio & Archive</title>
  
  <!-- Tipografia editorial retrô / contemporânea -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       PALETA DE CORES (Guia de Estilos Fornecido)
       ========================================================= */
    :root {
      --red-1: #4A1521;
      --red-2: #9E1B2C;
      --red-3: #C85A6A;
      --red-4: #D99B9F;

      --pink-1: #D92B6B;
      --pink-2: #E75F94;
      --pink-3: #F29BBF;
      --pink-4: #FBE3ED;

      --purple-1: #501344;
      --purple-2: #A12577;
      --purple-3: #D895C7;

      --yellow-1: #60491B;
      --yellow-2: #D3922A;
      --yellow-3: #DEB265;
      --yellow-4: #DCC298;

      --black: #0E0E0E;
      --gray-1: #4F4B4B;
      --gray-2: #969595;
      --white: #FFFFFF;

      /* Mapeamento Semântico e Referência */
      --bg-page: var(--pink-4);
      --bg-hero: #FFF7F2;
      --card-bg: var(--white);
      --text-main: var(--black);
      --text-muted: var(--gray-1);
      --border-dark: var(--black);

      --font-display: 'Syne', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       HEADER & NAVEGAÇÃO TRIPARTIDA (Conforme Referência)
       ========================================================= */
    header {
      background: var(--white);
      border-bottom: 2px solid var(--border-dark);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .nav-left {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-link {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: var(--red-2);
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--purple-1);
      text-transform: lowercase;
      text-align: center;
    }

    .brand-logo span {
      color: var(--red-2);
    }

    .nav-right {
      display: flex;
      gap: 1.25rem;
      justify-content: flex-end;
      align-items: center;
    }

    /* Seletor de Idioma PT / EN */
    .lang-switcher {
      display: inline-flex;
      background: var(--pink-4);
      border: 2px solid var(--border-dark);
      border-radius: 999px;
      overflow: hidden;
    }

    .lang-btn {
      background: transparent;
      border: none;
      padding: 0.3rem 0.75rem;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--black);
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: var(--red-2);
      color: var(--white);
    }

    /* TICKER MARQUEE */
    .ticker-bar {
      background: var(--red-1);
      color: var(--yellow-4);
      border-bottom: 2px solid var(--border-dark);
      overflow: hidden;
      white-space: nowrap;
      padding: 0.65rem 0;
      font-family: var(--font-display);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .ticker-content {
      display: inline-block;
      animation: ticker 32s linear infinite;
    }

    @keyframes ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* =========================================================
       HERO EDITORIAL / GET TO KNOW ME (Layout da Referência)
       ========================================================= */
    .hero-section {
      background-color: var(--white);
      border-bottom: 2px solid var(--border-dark);
      padding: 5rem 2rem;
    }

    .hero-container {
      max-width: 1080px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 4rem;
      align-items: center;
    }

    /* Moldura da Foto com Badge Circular Sobreposto */
    .hero-portrait-wrap {
      position: relative;
      width: 100%;
    }

    .hero-image-card {
      width: 100%;
      height: 480px;
      background: var(--pink-3);
      border: 2.5px solid var(--border-dark);
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 6px 6px 0px var(--border-dark);
    }

    .hero-image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Badge Circular Estilo Selo Vintage */
    .retro-badge {
      position: absolute;
      top: -24px;
      right: -24px;
      width: 96px;
      height: 96px;
      background: var(--pink-4);
      border: 2px solid var(--border-dark);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 3px 3px 0px var(--border-dark);
      transform: rotate(8deg);
      text-align: center;
      padding: 6px;
      z-index: 5;
    }

    .badge-heart {
      width: 18px;
      height: 18px;
      background: var(--red-2);
      clip-path: path('M12 4.248c-3.148-5.402-12-3.825-12 2.944 0 4.661 5.571 9.427 12 15.808 6.43-6.381 12-11.147 12-15.808 0-6.792-8.875-8.306-12-2.944z');
      transform: scale(0.65);
      margin-bottom: 2px;
    }

    .badge-text {
      font-family: var(--font-display);
      font-size: 0.58rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1.1;
      text-transform: uppercase;
      color: var(--purple-1);
    }

    /* Coluna de Descrição e Bio */
    .hero-bio-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: var(--black);
      margin-bottom: 1.5rem;
    }

    .hero-lead-highlight {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--purple-1);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .hero-body-text {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      color: var(--gray-1);
    }

    .hero-cta {
      display: inline-block;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 800;
      color: var(--black);
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 2.5px;
      transition: color 0.2s;
    }

    .hero-cta:hover {
      color: var(--red-2);
    }

    /* =========================================================
       CARDS INTRODUTÓRIOS (Estilo Features Ref)
       ========================================================= */
    .cards-section {
      background-color: var(--yellow-4);
      border-bottom: 2px solid var(--border-dark);
      padding: 4.5rem 2rem;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.75rem;
      max-width: 1080px;
      margin: 0 auto;
    }

    .retro-card {
      background: var(--white);
      border: 2px solid var(--border-dark);
      border-radius: 1.25rem;
      padding: 2rem;
      box-shadow: 5px 5px 0px var(--border-dark);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .retro-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px var(--border-dark);
    }

    .card-label {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      color: var(--pink-1);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 800;
      margin-bottom: 0.85rem;
      color: var(--purple-1);
    }

    .card-desc {
      color: var(--gray-1);
      font-size: 0.92rem;
    }

    /* =========================================================
       TIMELINE & GALERIA
       ========================================================= */
    .section-wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 5rem 1.5rem;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--red-1);
      margin-bottom: 2.5rem;
      text-transform: uppercase;
      border-left: 6px solid var(--yellow-2);
      padding-left: 1rem;
    }

    .timeline {
      position: relative;
      border-left: 3px solid var(--border-dark);
      margin-left: 1.5rem;
      padding-left: 2rem;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 2.5rem;
    }

    .timeline-item::before {
      content: '✦';
      position: absolute;
      left: calc(-2rem - 13px);
      top: -2px;
      width: 24px;
      height: 24px;
      background: var(--yellow-2);
      color: var(--black);
      border: 2px solid var(--border-dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .timeline-year {
      font-family: var(--font-mono);
      background: var(--purple-1);
      color: var(--white);
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .timeline-heading {
      font-family: var(--font-display);
      font-size: 1.25rem;
      color: var(--black);
      font-weight: 800;
      margin-bottom: 0.35rem;
    }

    .timeline-text {
      color: var(--gray-1);
      font-size: 0.95rem;
    }

    /* GALERIA DE OBRAS */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .gallery-item {
      background: var(--white);
      border: 2px solid var(--border-dark);
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 4px 4px 0px var(--border-dark);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .gallery-item:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--border-dark);
    }

    .gallery-img-container {
      width: 100%;
      height: 240px;
      background: var(--pink-3);
      border-bottom: 2px solid var(--border-dark);
      overflow: hidden;
    }

    .gallery-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover .gallery-img-container img {
      transform: scale(1.05);
    }

    .gallery-info {
      padding: 1.25rem;
    }

    .gallery-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--pink-1);
      font-weight: 700;
      text-transform: uppercase;
    }

    .gallery-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--black);
      margin: 0.25rem 0;
    }

    .gallery-desc {
      font-size: 0.88rem;
      color: var(--gray-1);
    }

    /* FOOTER */
    footer {
      background: var(--red-1);
      color: var(--white);
      border-top: 2px solid var(--border-dark);
      padding: 3.5rem 1.5rem;
      text-align: center;
    }

    .footer-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      color: var(--yellow-3);
    }

    .footer-copy {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--pink-4);
    }

    /* RESPONSIVIDADE */
    @media (max-width: 860px) {
      header {
        grid-template-columns: 1fr auto;
        gap: 1rem;
      }
      .nav-left {
        display: none;
      }
      .hero-container {
        grid-template-columns: 1fr;
        gap: 3rem;
      }
      .hero-portrait-wrap {
        max-width: 360px;
        margin: 0 auto;
      }
      .hero-image-card {
        height: 400px;
      }
      .hero-bio-wrap {
        text-align: center;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGAÇÃO / MENU COMPLETO -->
  <header>
    <nav class="nav-left">
      <a href="#about" class="nav-link" id="nav-about"></a>
      <a href="#timeline" class="nav-link" id="nav-timeline"></a>
      <a href="#works" class="nav-link" id="nav-works"></a>
    </nav>
    
    <a href="#" class="brand-logo">dormenique<span>✦</span></a>

    <div class="nav-right">
      <a href="#contact" class="nav-link" id="nav-contact"></a>
      <div class="lang-switcher">
        <button class="lang-btn active" id="btn-pt" onclick="setLanguage('pt')">PT</button>
        <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
      </div>
    </div>
  </header>

  <!-- MARQUEE TICKER -->
  <div class="ticker-bar">
    <div class="ticker-content" id="ticker-text"></div>
  </div>

  <!-- HERO SECTION NO ESTILO DA REFERÊNCIA -->
  <section class="hero-section" id="about">
    <div class="hero-container">
      
      <!-- Lado Esquerdo: Foto & Selo Sobreposto -->
      <div class="hero-portrait-wrap">
        <div class="hero-image-card">
          <img id="hero-img" src="" alt="Dormenique" />
        </div>
        <div class="retro-badge">
          <div class="badge-heart"></div>
          <span class="badge-text" id="badge-text"></span>
        </div>
      </div>

      <!-- Lado Direito: Texto, Bio & CTA -->
      <div class="hero-bio-wrap">
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-lead-highlight" id="hero-subtitle"></p>
        <div class="hero-body-text" id="hero-paragraphs"></div>
        <a href="#contact" class="hero-cta" id="hero-cta"></a>
      </div>

    </div>
  </section>

  <!-- CARDS DESTACADOS / VISÃO & PRÁTICA -->
  <section class="cards-section">
    <div class="intro-grid" id="intro-cards"></div>
  </section>

  <!-- TIMELINE ARTÍSTICA -->
  <section class="section-wrap" id="timeline">
    <h2 class="section-title" id="timeline-title"></h2>
    <div class="timeline" id="timeline-container"></div>
  </section>

  <!-- GALERIA DE OBRAS -->
  <section class="section-wrap" id="works">
    <h2 class="section-title" id="gallery-title"></h2>
    <div class="gallery-grid" id="gallery-container"></div>
  </section>

  <!-- RODAPÉ & CONTATO -->
  <footer id="contact">
    <div class="footer-title" id="footer-title">Dormenique</div>
    <div class="footer-copy" id="footer-copy"></div>
  </footer>

  <script>
    let currentLang = 'pt';
    let data = null;

    async function init() {
      try {
        const response = await fetch('./data.json');
        if (!response.ok) throw new Error('Falha ao carregar data.json');
        data = await response.json();
      } catch (err) {
        console.warn('Carregando dados de fallback...', err);
        data = FALLBACK_DATA;
      }
      render();
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btn-pt').classList.toggle('active', lang === 'pt');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      render();
    }

    function render() {
      if (!data) return;
      const langData = data[currentLang];

      // Menu de Navegação
      document.getElementById('nav-about').innerText = langData.nav.about;
      document.getElementById('nav-timeline').innerText = langData.nav.timeline;
      document.getElementById('nav-works').innerText = langData.nav.works;
      document.getElementById('nav-contact').innerText = langData.nav.contact;

      // Foto de Perfil & Selo
      document.getElementById('hero-img').src = data.profile_image;
      document.getElementById('badge-text').innerText = langData.hero.badge;

      // Textos da Hero (Bio & Títulos)
      document.getElementById('hero-title').innerText = langData.hero.title;
      document.getElementById('hero-subtitle').innerText = langData.hero.subtitle;
      
      const paragraphsContainer = document.getElementById('hero-paragraphs');
      paragraphsContainer.innerHTML = langData.hero.paragraphs.map(p => `<p>${p}</p>`).join('');

      const ctaEl = document.getElementById('hero-cta');
      ctaEl.innerText = langData.hero.cta_text;
      ctaEl.href = langData.hero.cta_link;

      // Ticker Marquee
      const tickerEl = document.getElementById('ticker-text');
      tickerEl.innerText = (langData.ticker + ' ').repeat(4);

      // Cards Introdutórios
      const introContainer = document.getElementById('intro-cards');
      introContainer.innerHTML = langData.intro_cards.map(c => `
        <article class="retro-card">
          <div class="card-label">${c.label}</div>
          <h3 class="card-title">${c.title}</h3>
          <p class="card-desc">${c.desc}</p>
        </article>
      `).join('');

      // Timeline
      document.getElementById('timeline-title').innerText = langData.timeline_title;
      const timelineContainer = document.getElementById('timeline-container');
      timelineContainer.innerHTML = langData.timeline.map(t => `
        <div class="timeline-item">
          <span class="timeline-year">${t.year}</span>
          <h4 class="timeline-heading">${t.title}</h4>
          <p class="timeline-text">${t.text}</p>
        </div>
      `).join('');

      // Galeria
      document.getElementById('gallery-title').innerText = langData.gallery_title;
      const galleryContainer = document.getElementById('gallery-container');
      galleryContainer.innerHTML = data.gallery.map(g => `
        <article class="gallery-item">
          <div class="gallery-img-container">
            <img src="${g.image}" alt="${g.title[currentLang] || ''}" loading="lazy" />
          </div>
          <div class="gallery-info">
            <span class="gallery-tag">${g.tag[currentLang] || ''}</span>
            <h4 class="gallery-title">${g.title[currentLang] || ''}</h4>
            <p class="gallery-desc">${g.desc[currentLang] || ''}</p>
          </div>
        </article>
      `).join('');

      // Footer
      document.getElementById('footer-title').innerText = langData.footer_title || 'Dormenique';
      document.getElementById('footer-copy').innerText = langData.footer_copy;
    }
