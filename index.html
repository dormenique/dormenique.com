<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dormenique — Portfolio & Archive</title>
  
  <!-- Tipografia editorial vintage / retrô moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       PALETA DE CORES (Baseada no guia de estilos)
       ========================================================= */
    :root {
      --red-1: #4A1521;
      --red-2: #9E1B2C;
      --red-3: #C85A6A;
      --red-4: #D99B9F;

      --pink-1: #D92B6B;
      --pink-2: #E75F94;
      --pink-3: #F29BBF;
      --pink-4: #FBE3ED;

      --purple-1: #501344;
      --purple-2: #A12577;
      --purple-3: #D895C7;

      --yellow-1: #60491B;
      --yellow-2: #D3922A;
      --yellow-3: #DEB265;
      --yellow-4: #DCC298;

      --black: #0E0E0E;
      --gray-1: #4F4B4B;
      --gray-2: #969595;
      --white: #FFFFFF;

      /* Mapeamento Semântico */
      --bg-main: var(--pink-4);
      --bg-card: var(--white);
      --text-main: var(--black);
      --text-muted: var(--gray-1);
      --accent: var(--red-2);
      --highlight: var(--yellow-2);
      --border-dark: var(--black);

      --font-display: 'Syne', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* BARRA SUPERIOR E NAVEGAÇÃO */
    header {
      background: var(--white);
      border-bottom: 2px solid var(--border-dark);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--purple-1);
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    /* BOTÃO SELETOR DE IDIOMA */
    .lang-switcher {
      display: flex;
      background: var(--pink-4);
      border: 2px solid var(--border-dark);
      border-radius: 999px;
      overflow: hidden;
    }

    .lang-btn {
      background: transparent;
      border: none;
      padding: 0.4rem 0.85rem;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      color: var(--black);
    }

    .lang-btn.active {
      background: var(--red-2);
      color: var(--white);
    }

    /* TICKER MARQUEE */
    .ticker-bar {
      background: var(--red-1);
      color: var(--yellow-4);
      border-bottom: 2px solid var(--border-dark);
      overflow: hidden;
      white-space: nowrap;
      padding: 0.65rem 0;
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .ticker-content {
      display: inline-block;
      animation: ticker 30s linear infinite;
    }

    @keyframes ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* SECÇÃO PRINCIPAL / HERO */
    .hero-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 1.5rem 3rem;
      text-align: center;
    }

    .hero-name {
      font-family: var(--font-display);
      font-size: clamp(3.2rem, 11vw, 9rem);
      line-height: 0.88;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: var(--red-2);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      text-shadow: 4px 4px 0px var(--yellow-3);
    }

    .hero-subtitle {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      color: var(--purple-1);
      max-width: 720px;
      margin: 0 auto 2.5rem;
      font-weight: 500;
    }

    /* DESTAQUES / CARDS SUPERIORES */
    .intro-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto 4rem;
      padding: 0 1.5rem;
    }

    .retro-card {
      background: var(--white);
      border: 2px solid var(--border-dark);
      border-radius: 1.25rem;
      padding: 2rem;
      box-shadow: 5px 5px 0px var(--border-dark);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .retro-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px var(--border-dark);
    }

    .card-label {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--pink-1);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: var(--purple-1);
    }

    .card-desc {
      color: var(--gray-1);
      font-size: 0.95rem;
    }

    /* SEÇÕES E TITULOS */
    .section-wrap {
      max-width: 1000px;
      margin: 0 auto 5rem;
      padding: 0 1.5rem;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--red-1);
      margin-bottom: 2.5rem;
      text-transform: uppercase;
      border-left: 6px solid var(--yellow-2);
      padding-left: 1rem;
    }

    /* TIMELINE */
    .timeline {
      position: relative;
      border-left: 3px solid var(--border-dark);
      margin-left: 1.5rem;
      padding-left: 2rem;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 2.5rem;
    }

    .timeline-item::before {
      content: '✦';
      position: absolute;
      left: calc(-2rem - 13px);
      top: -2px;
      width: 24px;
      height: 24px;
      background: var(--yellow-2);
      color: var(--black);
      border: 2px solid var(--border-dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .timeline-year {
      font-family: var(--font-mono);
      background: var(--purple-1);
      color: var(--white);
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .timeline-heading {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--black);
      font-weight: 800;
      margin-bottom: 0.35rem;
    }

    .timeline-text {
      color: var(--gray-1);
      font-size: 0.95rem;
    }

    /* GALERIA DE OBRAS */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .gallery-item {
      background: var(--white);
      border: 2px solid var(--border-dark);
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 4px 4px 0px var(--border-dark);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .gallery-item:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--border-dark);
    }

    .gallery-img-container {
      width: 100%;
      height: 240px;
      background: var(--pink-3);
      border-bottom: 2px solid var(--border-dark);
      overflow: hidden;
    }

    .gallery-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover .gallery-img-container img {
      transform: scale(1.05);
    }

    .gallery-info {
      padding: 1.25rem;
    }

    .gallery-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--pink-1);
      font-weight: 700;
      text-transform: uppercase;
    }

    .gallery-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--black);
      margin: 0.25rem 0;
    }

    .gallery-desc {
      font-size: 0.88rem;
      color: var(--gray-1);
    }

    /* RODAPÉ */
    footer {
      background: var(--red-1);
      color: var(--white);
      border-top: 2px solid var(--border-dark);
      padding: 3rem 1.5rem;
      text-align: center;
    }

    .footer-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: var(--yellow-3);
    }

    .footer-copy {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--pink-4);
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGAÇÃO -->
  <header>
    <div class="brand-logo">Dormenique</div>
    <div class="nav-actions">
      <div class="lang-switcher">
        <button class="lang-btn active" id="btn-pt" onclick="setLanguage('pt')">PT</button>
        <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
      </div>
    </div>
  </header>

  <!-- MARQUEE TICKER -->
  <div class="ticker-bar">
    <div class="ticker-content" id="ticker-text"></div>
  </div>

  <!-- HERO -->
  <main class="hero-container">
    <h1 class="hero-name">Dormenique</h1>
    <p class="hero-subtitle" id="hero-lead"></p>
  </main>

  <!-- CARDS INTRODUTÓRIOS -->
  <section class="intro-grid" id="intro-cards"></section>

  <!-- TIMELINE ARTÍSTICA -->
  <section class="section-wrap">
    <h2 class="section-title" id="timeline-title"></h2>
    <div class="timeline" id="timeline-container"></div>
  </section>

  <!-- GALERIA DE OBRAS -->
  <section class="section-wrap">
    <h2 class="section-title" id="gallery-title"></h2>
    <div class="gallery-grid" id="gallery-container"></div>
  </section>

  <!-- RODAPÉ -->
  <footer>
    <div class="footer-title" id="footer-title">Dormenique</div>
    <div class="footer-copy" id="footer-copy"></div>
  </footer>

  <script>
    let currentLang = 'pt';
    let data = null;

    async function init() {
      try {
        const response = await fetch('./data.json');
        if (!response.ok) throw new Error('Não foi possível carregar data.json');
        data = await response.json();
      } catch (err) {
        console.warn('Carregamento via fetch falhou ou arquivo local isolado. Usando fallback embutido.', err);
        data = FALLBACK_DATA;
      }
      render();
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btn-pt').classList.toggle('active', lang === 'pt');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      render();
    }

    function render() {
      if (!data) return;
      const langData = data[currentLang];

      // Ticker
      const tickerEl = document.getElementById('ticker-text');
      const tickerText = (langData.ticker + ' ').repeat(4);
      tickerEl.innerText = tickerText;

      // Hero
      document.getElementById('hero-lead').innerText = langData.hero_lead;

      // Cards Introdutórios
      const introContainer = document.getElementById('intro-cards');
      introContainer.innerHTML = langData.intro_cards.map(c => `
        <article class="retro-card">
          <div class="card-label">${c.label}</div>
          <h3 class="card-title">${c.title}</h3>
          <p class="card-desc">${c.desc}</p>
        </article>
      `).join('');

      // Timeline
      document.getElementById('timeline-title').innerText = langData.timeline_title;
      const timelineContainer = document.getElementById('timeline-container');
      timelineContainer.innerHTML = langData.timeline.map(t => `
        <div class="timeline-item">
          <span class="timeline-year">${t.year}</span>
          <h4 class="timeline-heading">${t.title}</h4>
          <p class="timeline-text">${t.text}</p>
        </div>
      `).join('');

      // Galeria
      document.getElementById('gallery-title').innerText = langData.gallery_title;
      const galleryContainer = document.getElementById('gallery-container');
      galleryContainer.innerHTML = data.gallery.map(g => `
        <article class="gallery-item">
          <div class="gallery-img-container">
            <img src="${g.image}" alt="${g.title[currentLang] || ''}" loading="lazy" />
          </div>
          <div class="gallery-info">
            <span class="gallery-tag">${g.tag[currentLang] || ''}</span>
            <h4 class="gallery-title">${g.title[currentLang] || ''}</h4>
            <p class="gallery-desc">${g.desc[currentLang] || ''}</p>
          </div>
        </article>
      `).join('');

      // Footer
      document.getElementById('footer-title').innerText = langData.footer_title || 'Dormenique';
      document.getElementById('footer-copy').innerText = langData.footer_copy;
    }
